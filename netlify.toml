# Netlify: build + host the web app / iPhone PWA. Every push to main redeploys automatically.
[build]
  command = "npm run build"
  publish = "dist"
  # Save build credits: only rebuild when something that can change the WEBSITE changed.
  # Changes to README, android/, releases/ and .github/ are skipped (exit 0 = skip, exit 1 = build).
  # With no previous deploy to compare against, git diff fails and the site is built (safe).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site shell fonts public config scripts package.json package-lock.json netlify.toml"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: any path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker, shell and manifest must never be cached, or installed copies would not see updates
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/shell.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
