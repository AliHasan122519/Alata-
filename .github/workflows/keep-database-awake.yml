# Supabase's free plan pauses a project after about a week without activity, which would take the store offline.
# This pings the database every 3 days (a harmless read of one row) so it stays awake.
# If the database is ALREADY paused or unreachable the run fails, which sends you a GitHub notification.
# NOTE: GitHub stops scheduled workflows after 60 days without any commit to the repository; run it manually once to re-enable.
name: Keep database awake

on:
  schedule:
    - cron: "23 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read one row from the database
        run: |
          URL=$(python3 -c "import json;print(json.load(open('config/backend.json'))['url'])")
          KEY=$(python3 -c "import json;print(json.load(open('config/backend.json'))['key'])")
          [ -n "$URL" ] && [ -n "$KEY" ] || { echo "::error::config/backend.json has no url/key"; exit 1; }
          CODE=$(curl -sS -o /tmp/out.json -w "%{http_code}" "$URL/rest/v1/store_settings?select=key&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::Database did not answer (HTTP $CODE). If the project was paused, restore it from the Supabase dashboard."; exit 1; }
