# Copies your published Lovable site into this repo whenever it changed, then releases it:
#   - the commit redeploys the web app on Netlify (installed iPhone copies update by themselves)
#   - it triggers "Release Android APK", so installed Android apps get the "new update" prompt
# Runs every 2 hours and on demand (Actions -> Sync from Lovable -> Run workflow).
# NOTE: GitHub pauses scheduled workflows after 60 days without repository activity; run it manually to re-enable.
name: Sync from Lovable

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-lovable
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mirror the published site
        run: node scripts/sync-from-lovable.mjs
      - name: Commit and release if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain site)" ]; then
            echo "No changes in the published site."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -m "Sync from Lovable: published site updated"
          git push
          # pushes made with GITHUB_TOKEN do not start other workflows, so start the APK release explicitly
          gh workflow run release-android.yml --ref "${GITHUB_REF_NAME}"
