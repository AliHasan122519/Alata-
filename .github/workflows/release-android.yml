# Builds a signed APK on every push to main and publishes it as a GitHub Release.
# Installed Android apps look at the latest release, show "تحديث جديد", and install it from inside the app.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions): see README "Signing".
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks keystore
#   ANDROID_KEYSTORE_PASSWORD password of the keystore (also used for the key)
name: Release Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "netlify.toml"
      - "releases/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  # Without the signing secrets an APK would be useless (Android refuses to update an app signed with another key),
  # so on a normal push we SKIP quietly instead of failing every time. A manual run still fails loudly.
  precheck:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.sec.outputs.ok }}
    steps:
      - id: sec
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            MSG="Signing secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are not set, so no Android release was built. See README 'الإعداد'."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::$MSG"; exit 1; fi
            echo "::notice::$MSG"
          fi

  apk:
    needs: precheck
    if: needs.precheck.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compute version
        id: v
        run: |
          MAJOR_MINOR=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "name=${MAJOR_MINOR}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Build web assets
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -PappVersionName=${{ steps.v.outputs.name }} -PappVersionCode=${{ steps.v.outputs.code }} --no-daemon

      - name: Verify signature and rename
        id: apk
        run: |
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$SRC"
          OUT="giving-store-v${{ steps.v.outputs.name }}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Release notes from commits
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          { git log $RANGE --no-merges --pretty=format:"• %s" | head -n 15; } > notes.txt
          [ -s notes.txt ] || echo "تحسينات عامة" > notes.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.name }}" "${{ steps.apk.outputs.file }}" \
            --title "v${{ steps.v.outputs.name }}" \
            --notes-file notes.txt \
            --latest
