# Publishes the web app (and the installable iPhone PWA) to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "android/**"
      - ".github/workflows/release-android.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm run build
          # Single-page-app fallback so deep links like /admin work on GitHub Pages
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
